<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dorset Police Boat | ERLCX</title>

<link rel="icon" href="https://erlcx.com/erlcxfavicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --orange:#fd7000;
    --orange-light:#ff8a2b;
    --background:#0f0f0f;
    --secondary:#1a1a1a;
    --card:rgba(255,255,255,0.055);
    --card-hover:rgba(255,255,255,0.075);
    --border:rgba(255,255,255,0.11);
    --text:#ffffff;
    --muted:rgba(255,255,255,0.55);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:var(--background);
    color:var(--text);
    font-family:"Inter",Arial,sans-serif;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    top:-200px;
    left:5%;
    background:var(--orange);
    filter:blur(180px);
    opacity:.13;
    border-radius:50%;
    pointer-events:none;
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    bottom:-250px;
    right:5%;
    background:var(--orange);
    filter:blur(180px);
    opacity:.10;
    border-radius:50%;
    pointer-events:none;
    z-index:-2;
}

.page-glow{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(253,112,0,.06),
            transparent 35%
        );
}

/* =========================
   NAVBAR
========================= */

.nav-wrapper{
    position:sticky;
    top:0;
    z-index:100;
    padding:18px 20px;
}

.navbar{
    width:min(1150px,100%);
    margin:auto;
    min-height:64px;
    padding:10px 14px 10px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    background:rgba(26,26,26,.78);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.3);
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    color:white;
    text-decoration:none;
    font-weight:800;
    font-size:19px;
}

.logo img{
    width:39px;
    height:39px;
    object-fit:contain;
    border-radius:10px;
}

.logo span{
    color:var(--orange);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:6px;
}

.nav-links a{
    color:rgba(255,255,255,.65);
    text-decoration:none;
    padding:10px 13px;
    border-radius:999px;
    font-size:14px;
    font-weight:500;
    transition:.2s ease;
}

.nav-links a:hover{
    color:white;
    background:rgba(255,255,255,.07);
}

.login-button{
    display:flex;
    align-items:center;
    gap:8px;

    color:#000;
    background:var(--orange);

    text-decoration:none;
    padding:11px 18px;
    border-radius:999px;

    font-size:14px;
    font-weight:700;

    transition:.2s ease;
}

.login-button:hover{
    background:var(--orange-light);
    transform:translateY(-1px);
}

/* =========================
   MAIN
========================= */

main{
    width:min(1150px,100%);
    margin:auto;
    padding:25px 20px 90px;
}

/* =========================
   BACK BUTTON
========================= */

.back-button{
    display:inline-flex;
    align-items:center;
    gap:8px;

    color:rgba(255,255,255,.62);
    text-decoration:none;

    padding:9px 13px;
    margin-bottom:25px;

    border:1px solid transparent;
    border-radius:10px;

    font-size:13px;
    font-weight:600;

    transition:.2s ease;
}

.back-button:hover{
    color:white;
    background:rgba(255,255,255,.06);
    border-color:var(--border);
}

.back-button span{
    font-size:18px;
}

/* =========================
   TITLE
========================= */

.item-header{
    margin-bottom:25px;
}

.item-title{
    font-size:clamp(32px,5vw,52px);
    line-height:1.05;
    font-weight:800;
    letter-spacing:-1.8px;
    margin-bottom:15px;
}

.item-title span{
    color:var(--orange);
}

.item-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.rating{
    display:flex;
    align-items:center;
    gap:2px;
    color:#ffbd3d;
    font-size:16px;
}

.rating-number{
    color:rgba(255,255,255,.55);
    font-size:13px;
    margin-left:6px;
}

.tag{
    padding:6px 10px;
    border-radius:8px;

    color:rgba(255,255,255,.7);
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1);

    font-size:12px;
    font-weight:600;

    text-decoration:none;
    transition:.2s ease;
}

.tag:hover{
    color:white;
    border-color:var(--orange);
}

/* =========================
   CONTENT GRID
========================= */

.content-grid{
    display:grid;
    grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);
    gap:24px;
    align-items:start;
}

/* =========================
   CARDS
========================= */

.card{
    background:var(--card);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    border:1px solid var(--border);
    border-radius:20px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.2);

    transition:.25s ease;
}

.card:hover{
    border-color:rgba(255,255,255,.15);
}

.card-header{
    padding:20px 22px 0;
}

.card-title{
    display:flex;
    align-items:center;
    gap:9px;

    color:rgba(255,255,255,.52);

    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:2px;
}

.card-title .orange{
    color:var(--orange);
}

/* =========================
   IMAGE GALLERY
========================= */

.gallery-card{
    padding:12px;
}

.main-image-container{
    position:relative;
    width:100%;
    aspect-ratio:16/10;

    overflow:hidden;
    border-radius:15px;

    background:#080808;
    border:1px solid rgba(255,255,255,.08);
}

.main-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;

    transition:opacity .2s ease,transform .35s ease;
}

.main-image-container:hover .main-image{
    transform:scale(1.015);
}

.gallery-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    width:42px;
    height:42px;

    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);

    background:rgba(10,10,10,.65);
    color:white;

    font-size:20px;
    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:.2s ease;
}

.gallery-arrow:hover{
    background:var(--orange);
    color:#000;
    border-color:var(--orange);
}

.gallery-arrow.left{
    left:14px;
}

.gallery-arrow.right{
    right:14px;
}

.thumbnails{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:10px;
}

.thumbnail{
    height:75px;
    border-radius:11px;
    overflow:hidden;
    cursor:pointer;

    background:#111;
    border:2px solid transparent;

    transition:.2s ease;
}

.thumbnail:hover{
    border-color:rgba(253,112,0,.6);
}

.thumbnail.active{
    border-color:var(--orange);
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   DESCRIPTION
========================= */

.section{
    margin-top:20px;
}

.section-label{
    color:rgba(255,255,255,.5);
    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.description-card{
    padding:23px;
}

.description-card p{
    color:rgba(255,255,255,.68);
    line-height:1.75;
    font-size:15px;
}

.description-card h2{
    color:white;
    font-size:18px;
    margin:20px 0 8px;
}

/* =========================
   CODE CARD
========================= */

.code-card{
    padding:16px;
}

.code-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    padding:13px 14px;
    margin-bottom:9px;

    background:rgba(0,0,0,.24);
    border:1px solid rgba(255,255,255,.09);
    border-radius:11px;
}

.code-row:last-child{
    margin-bottom:0;
}

.code-name{
    color:rgba(255,255,255,.65);
    font-size:13px;
    font-weight:600;
}

.code-value{
    display:flex;
    align-items:center;
    gap:8px;
}

code{
    color:var(--orange);
    background:rgba(253,112,0,.08);
    border:1px solid rgba(253,112,0,.18);

    padding:6px 9px;
    border-radius:7px;

    font-family:monospace;
    font-size:13px;
    word-break:break-all;
}

.copy-button{
    width:32px;
    height:32px;

    border:none;
    border-radius:8px;

    background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.7);

    cursor:pointer;
    transition:.2s ease;
}

.copy-button:hover{
    background:var(--orange);
    color:#000;
}

/* =========================
   STATS
========================= */

.stats-card{
    padding:20px;
}

.stat{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:13px 0;

    border-bottom:1px solid rgba(255,255,255,.07);
}

.stat:last-child{
    border-bottom:0;
}

.stat-name{
    display:flex;
    align-items:center;
    gap:9px;

    color:rgba(255,255,255,.52);
    font-size:13px;
}

.stat-value{
    color:white;
    font-weight:700;
    font-size:14px;
}

/* =========================
   TAGS
========================= */

.tags-card{
    padding:20px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.tags .tag{
    background:rgba(255,255,255,.04);
}

/* =========================
   AUTHOR
========================= */

.author-card{
    padding:20px;
}

.author{
    display:flex;
    align-items:center;
    gap:13px;
}

.author-avatar{
